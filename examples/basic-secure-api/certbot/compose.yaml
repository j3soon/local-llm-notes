name: local-llm

services:
  llama-cpp:
    image: ${LLAMA_CPP_IMAGE}
    restart: unless-stopped
    command: >-
      -hf unsloth/Qwen3.8-27B-GGUF:UD-Q4_K_XL
      --port 37000
      --temp 1.0
      --top-p 0.95
      --top-k 20
      --min-p 0.0
      --chat-template-kwargs '{"reasoning_effort":"medium"}'
      --spec-type draft-mtp
      --spec-draft-n-max 2
      --jinja
    expose:
      - "37000"
    ports:
      # Host-local llama.cpp web UI (loopback only). This bypasses NGINX auth
      # and exposes the FULL, UNAUTHENTICATED API to anything that can reach
      # 127.0.0.1 on this host, including other local users and SSH port
      # forwards. Remove this mapping to keep the model reachable only through
      # the authenticated NGINX entrypoint.
      - "127.0.0.1:38000:37000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:37000"]
    volumes:
      - ../../../.cache:/root/.cache
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  nginx:
    image: nginx:1.29
    restart: unless-stopped
    depends_on:
      - llama-cpp
    env_file:
      - .env
    ports:
      - "80:80"
      - "37000:37000"
    command: ["/bin/sh", "/opt/nginx/start-nginx.sh"]
    volumes:
      - ./nginx-http01.conf:/opt/nginx/nginx-http01.conf.template:ro
      - ./nginx-tls.conf:/opt/nginx/nginx-tls.conf.template:ro
      - ./scripts/start-nginx.sh:/opt/nginx/start-nginx.sh:ro
      - ./state/letsencrypt:/etc/letsencrypt
      - ./state/www:/var/www/certbot

  certbot:
    image: certbot/certbot:latest
    restart: unless-stopped
    depends_on:
      - nginx
    env_file:
      - .env
    entrypoint:
      - /bin/sh
      - /opt/certbot/certbot-loop.sh
    volumes:
      - ./scripts/certbot-loop.sh:/opt/certbot/certbot-loop.sh:ro
      - ./state/letsencrypt:/etc/letsencrypt
      - ./state/www:/var/www/certbot

# `llama-cpp` stays private on the Compose network.
# `nginx` is the only public entrypoint for the API.
# Port 80 is exposed only for the Let's Encrypt HTTP challenge.
# Edit this file directly if you want a different model, API port, or llama.cpp flags.
