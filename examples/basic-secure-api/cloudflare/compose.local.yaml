name: local-llm

services:
  llama-cpp:
    image: ${LLAMA_CPP_IMAGE}
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        snapshot="$$(cat /root/.cache/huggingface/hub/models--unsloth--Qwen3.8-27B-GGUF/refs/main)"
        exec /app/llama-server \
          -m "/root/.cache/huggingface/hub/models--unsloth--Qwen3.8-27B-GGUF/snapshots/$$snapshot/Qwen3.8-27B-UD-Q4_K_XL.gguf" \
          --port 37000 \
          --temp 1.0 \
          --top-p 0.95 \
          --top-k 20 \
          --min-p 0.0 \
          --chat-template-kwargs '{"reasoning_effort":"medium"}' \
          --spec-type draft-mtp \
          --spec-draft-n-max 2 \
          --jinja
    expose:
      - "37000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:37000"]
    volumes:
      - ../../../.cache:/root/.cache
    networks:
      - internal_only
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

networks:
  internal_only:
    name: local-llm-internal
    internal: true

# This stack has no published ports and no outbound internet access.
# Attach other containers to `local-llm-internal` to reach the model locally.
# Example for another compose file:
#   networks:
#     local-llm-internal:
#       external: true
