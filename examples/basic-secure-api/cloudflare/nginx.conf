events {}

http {
    server_tokens off;

    server {
        listen 80;
        client_max_body_size 16m;

        location = /v1/chat/completions {
            if ($http_authorization != "Bearer ${LLM_API_KEY}") {
                add_header WWW-Authenticate 'Bearer realm="LLM API"';
                return 401;
            }

            proxy_pass http://${LLM_UPSTREAM};
            proxy_buffering off;
            proxy_read_timeout 3600s;
        }

        location / {
            return 403;
        }
    }
}
