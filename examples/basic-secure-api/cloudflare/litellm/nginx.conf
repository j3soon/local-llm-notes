events {}

http {
    server_tokens off;

    server {
        listen 80;
        client_max_body_size 16m;

        # LiteLLM authenticates bearer tokens, including virtual keys.
        proxy_buffering off;
        proxy_read_timeout 3600s;

        location = /v1/models {
            limit_except GET {
                deny all;
            }
            proxy_pass http://litellm:4000;
        }

        location ~ ^/v1/(chat/completions|responses)$ {
            limit_except POST {
                deny all;
            }
            proxy_pass http://litellm:4000;
        }

        # Deny the UI, docs, management API, and all other routes.
        location / {
            return 403;
        }
    }
}
