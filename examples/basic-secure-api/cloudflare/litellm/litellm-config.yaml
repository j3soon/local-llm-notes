# Comment out models and their virtual-key permissions when their API key is empty.
model_list:
  # Optional direct OpenAI routes (disabled by default).
  # - model_name: gpt-6.1-sol
  #   litellm_params:
  #     model: openai/gpt-6.1-sol
  #     api_key: os.environ/OPENAI_API_KEY
  #   # Keep the upstream model name so LiteLLM can use its OpenAI cost map,
  #   # including cached input and reasoning/output token pricing.

  # - model_name: gpt-6-luna
  #   litellm_params:
  #     model: openai/gpt-6-luna
  #     api_key: os.environ/OPENAI_API_KEY

  # Azure deployments: set AZURE_API_KEY, AZURE_API_BASE, and AZURE_API_VERSION.
  # AZURE_API_VERSION=v1 selects /openai/v1/ from the resource-root api_base.
  # Deployment names must match those in your Azure resource.
  # Explicit IDs keep deployment identity independent of connection parameters.
  # Reference: https://docs.litellm.ai/docs/providers/azure
  # API lifecycle: https://learn.microsoft.com/en-us/azure/foundry/openai/api-version-lifecycle?tabs=python#api-version-changelog
  - model_name: azure/gpt-6.1-sol
    litellm_params:
      model: azure/gpt-6.1-sol
      reasoning_effort: low
      api_key: os.environ/AZURE_API_KEY
      api_base: os.environ/AZURE_API_BASE
      api_version: os.environ/AZURE_API_VERSION
    model_info:
      id: azure-gpt-6-1-sol
      base_model: azure/gpt-6.1-sol
      chat_reasoning_options:
        - id: low
          label: Low
          parameters:
            reasoning_effort: low
        - id: medium
          label: Medium
          parameters:
            reasoning_effort: medium
        - id: high
          label: High
          parameters:
            reasoning_effort: high
        - id: xhigh
          label: XHigh
          parameters:
            reasoning_effort: xhigh
        - id: max
          label: Max
          parameters:
            reasoning_effort: max

  - model_name: azure/gpt-6-luna
    litellm_params:
      model: azure/gpt-6-luna
      reasoning_effort: low
      api_key: os.environ/AZURE_API_KEY
      api_base: os.environ/AZURE_API_BASE
      api_version: os.environ/AZURE_API_VERSION
    model_info:
      id: azure-gpt-6-luna
      base_model: azure/gpt-6-luna
      chat_reasoning_options:
        - id: none
          label: None
          parameters:
            reasoning_effort: none
        - id: low
          label: Low
          parameters:
            reasoning_effort: low
        - id: medium
          label: Medium
          parameters:
            reasoning_effort: medium
        - id: high
          label: High
          parameters:
            reasoning_effort: high
        - id: xhigh
          label: XHigh
          parameters:
            reasoning_effort: xhigh
        - id: max
          label: Max
          parameters:
            reasoning_effort: max

  # Model Router reports its selected model; do not set a fixed base_model.
  # - model_name: azure/model-router
  #   litellm_params:
  #     model: azure/model-router
  #     api_key: os.environ/AZURE_API_KEY
  #     api_base: os.environ/AZURE_API_BASE
  #     api_version: os.environ/AZURE_API_VERSION

  # Two vLLM servers share this model group: the always-on primary below and an
  # occasionally powered-on secondary. Simple-shuffle splits traffic about 50/50
  # while both pass background health checks. Explicit IDs identify each server
  # in health checks, logs, and the x-litellm-model-id response header.
  - model_name: unsloth/Qwen3.8-27B-NVFP4
    litellm_params: &qwen_params
      model: hosted_vllm/unsloth/Qwen3.8-27B-NVFP4
      api_base: os.environ/VLLM_API_BASE
      api_key: os.environ/VLLM_API_KEY
      chat_template_kwargs:
        enable_thinking: true
        reasoning_effort: xhigh
    model_info: &qwen_info
      id: qwen-primary
      mode: chat
      # Bound each probe so an unreachable server cannot stretch the 30s cycle.
      health_check_timeout: 15
      supports_function_calling: true
      supports_reasoning: true
      supports_vision: true
      # GPT-style labels mapped to Qwen's native template parameters.
      chat_reasoning_options:
        - id: none
          label: None
          parameters:
            chat_template_kwargs:
              enable_thinking: false
        - id: low
          label: Low
          parameters:
            chat_template_kwargs:
              enable_thinking: true
              reasoning_effort: low
        - id: medium
          label: Medium
          parameters:
            chat_template_kwargs:
              enable_thinking: true
              reasoning_effort: medium
        - id: xhigh
          label: XHigh
          parameters:
            chat_template_kwargs:
              enable_thinking: true
              reasoning_effort: xhigh
      # Nominal USD per token to keep LiteLLM's native cost fields present.
      # These reporting rates do not measure GPU operating costs.
      input_cost_per_token: 5.0e-324
      output_cost_per_token: 5.0e-324
      cache_read_input_token_cost: 5.0e-324
      # vLLM /v1/models exposes max_model_len only; LiteLLM discovers limits
      # asynchronously and does not import capability flags. Keep shared metadata
      # available before discovery and during upstream outages. See docs/qwen-metadata-validation.md.
      # These are individual ceilings within ONE shared prompt + output budget,
      # not additive allowances. No separate max_new_tokens cap is configured.
      max_tokens: 262144
      max_input_tokens: 262144
      max_output_tokens: 262144
      supported_endpoints:
        - /v1/chat/completions
        - /v1/responses
      supports_system_messages: true
      supports_parallel_function_calling: true
      supports_tool_choice: true
      supports_prompt_caching: true
      supports_native_streaming: true
      supports_response_schema: true
      supports_native_structured_output: true

  # Secondary runs the same model/configuration and shares all metadata.
  # Override only its endpoint, key, and ID. Comment out if not configured.
  - model_name: unsloth/Qwen3.8-27B-NVFP4
    litellm_params:
      <<: *qwen_params
      api_base: os.environ/VLLM_API_BASE_SECONDARY
      api_key: os.environ/VLLM_API_KEY_SECONDARY
    model_info:
      <<: *qwen_info
      id: qwen-secondary

litellm_settings:
  json_logs: true
  # Request usage.cost in streaming usage chunks; v1.106.2 may omit zero costs.
  # https://github.com/BerriAI/litellm/blob/v1.106.2/litellm/proxy/common_request_processing.py
  include_cost_in_streaming_usage: true
  turn_off_message_logging: false
  # Reject unsupported parameters instead of silently removing them.
  drop_params: false
  # Defaults applied when a virtual key is created through the local API/UI.
  default_key_generate_params:
    models:
      # - gpt-6.1-sol
      # - gpt-6-luna
      - azure/gpt-6.1-sol
      - azure/gpt-6-luna
      # - azure/model-router
      - unsloth/Qwen3.8-27B-NVFP4
    max_budget: 20
    budget_duration: 30d
    rpm_limit: 60

router_settings:
  # Avoid automatically repeating a billable request after an upstream failure.
  num_retries: 0
  # Default strategy: random choice among healthy deployments in a model group.
  routing_strategy: simple-shuffle
  # Keep requests with a session ID (such as an x-session-id header) on one
  # deployment for an hour, reusing its vLLM prefix cache. Requests without one
  # stay random; a pin to an unhealthy deployment falls back to a healthy one.
  optional_pre_call_checks:
    - session_affinity

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  disable_spend_logs: false
  store_prompts_in_spend_logs: true
  # Leave always_include_stream_usage unset: v1.106.2 requests upstream usage
  # for streamed chat, even if the client omits it, without changing non-streams.

  # Probe only the Qwen group every 30s; Azure is never probed in the background.
  # Health-check routing skips deployments whose latest probe failed and restores
  # them after a passing probe. If every Qwen deployment fails, none is skipped.
  # https://github.com/BerriAI/litellm/blob/v1.106.2/litellm/proxy/proxy_server.py
  background_health_checks: true
  health_check_interval: 30
  background_health_check_model_groups:
    - unsloth/Qwen3.8-27B-NVFP4
  enable_health_check_routing: true
