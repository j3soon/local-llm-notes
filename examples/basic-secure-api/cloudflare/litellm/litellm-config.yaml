# Comment out models and their virtual-key permissions when their API key is empty.
model_list:
  # Optional direct OpenAI routes (disabled by default).
  # - model_name: gpt-6.1-sol
  #   litellm_params:
  #     model: openai/gpt-6.1-sol
  #     api_key: os.environ/OPENAI_API_KEY
  #   # Keep the upstream model name so LiteLLM can use its OpenAI cost map,
  #   # including cached input and reasoning/output token pricing.

  # - model_name: gpt-6-luna
  #   litellm_params:
  #     model: openai/gpt-6-luna
  #     api_key: os.environ/OPENAI_API_KEY

  # Azure deployments: set AZURE_API_KEY, AZURE_API_BASE, and AZURE_API_VERSION.
  # AZURE_API_VERSION=v1 selects /openai/v1/ from the resource-root api_base.
  # Deployment names must match those in your Azure resource.
  # Explicit IDs keep deployment identity independent of connection parameters.
  # Reference: https://docs.litellm.ai/docs/providers/azure
  # API lifecycle: https://learn.microsoft.com/en-us/azure/foundry/openai/api-version-lifecycle?tabs=python#api-version-changelog
  - model_name: azure/gpt-6.1-sol
    litellm_params:
      model: azure/gpt-6.1-sol
      reasoning_effort: low
      api_key: os.environ/AZURE_API_KEY
      api_base: os.environ/AZURE_API_BASE
      api_version: os.environ/AZURE_API_VERSION
    model_info:
      id: azure-gpt-6-1-sol
      base_model: azure/gpt-6.1-sol
      chat_reasoning_options:
        - id: low
          label: Low
          parameters:
            reasoning_effort: low
        - id: medium
          label: Medium
          parameters:
            reasoning_effort: medium
        - id: high
          label: High
          parameters:
            reasoning_effort: high
        - id: xhigh
          label: XHigh
          parameters:
            reasoning_effort: xhigh
        - id: max
          label: Max
          parameters:
            reasoning_effort: max

  - model_name: azure/gpt-6-luna
    litellm_params:
      model: azure/gpt-6-luna
      reasoning_effort: low
      api_key: os.environ/AZURE_API_KEY
      api_base: os.environ/AZURE_API_BASE
      api_version: os.environ/AZURE_API_VERSION
    model_info:
      id: azure-gpt-6-luna
      base_model: azure/gpt-6-luna
      chat_reasoning_options:
        - id: none
          label: None
          parameters:
            reasoning_effort: none
        - id: low
          label: Low
          parameters:
            reasoning_effort: low
        - id: medium
          label: Medium
          parameters:
            reasoning_effort: medium
        - id: high
          label: High
          parameters:
            reasoning_effort: high
        - id: xhigh
          label: XHigh
          parameters:
            reasoning_effort: xhigh
        - id: max
          label: Max
          parameters:
            reasoning_effort: max

  # Model Router reports its selected model; do not set a fixed base_model.
  # - model_name: azure/model-router
  #   litellm_params:
  #     model: azure/model-router
  #     api_key: os.environ/AZURE_API_KEY
  #     api_base: os.environ/AZURE_API_BASE
  #     api_version: os.environ/AZURE_API_VERSION

  - model_name: unsloth/Qwen3.8-27B-NVFP4
    litellm_params:
      model: hosted_vllm/unsloth/Qwen3.8-27B-NVFP4
      api_base: os.environ/VLLM_API_BASE
      api_key: os.environ/VLLM_API_KEY
      chat_template_kwargs:
        enable_thinking: true
    model_info:
      mode: chat
      supports_function_calling: true
      supports_reasoning: true
      supports_vision: true
      # Advertise both modes. The deployment default enables thinking.
      chat_reasoning_options:
        - id: "off"
          label: "Off"
          parameters:
            chat_template_kwargs:
              enable_thinking: false
        - id: "on"
          label: "On"
          parameters:
            chat_template_kwargs:
              enable_thinking: true
      # USD per token. Zero means no provider fee, not zero hardware cost.
      # Set numeric rates here to allocate self-hosted inference costs.
      input_cost_per_token: 0.0
      output_cost_per_token: 0.0
      cache_read_input_token_cost: 0.0

litellm_settings:
  json_logs: true
  # Include usage.cost in streaming usage chunks, including zero-cost models.
  # https://github.com/BerriAI/litellm/blob/v1.106.2/litellm/proxy/common_request_processing.py
  include_cost_in_streaming_usage: true
  turn_off_message_logging: false
  # Reject unsupported parameters instead of silently removing them.
  drop_params: false
  # Defaults applied when a virtual key is created through the local API/UI.
  default_key_generate_params:
    models:
      # - gpt-6.1-sol
      # - gpt-6-luna
      - azure/gpt-6.1-sol
      - azure/gpt-6-luna
      # - azure/model-router
      - unsloth/Qwen3.8-27B-NVFP4
    max_budget: 20
    budget_duration: 30d
    rpm_limit: 60

router_settings:
  # Avoid automatically repeating a billable request after an upstream failure.
  num_retries: 0

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  disable_spend_logs: false
  store_prompts_in_spend_logs: true
  # Leave always_include_stream_usage unset: v1.106.2 requests upstream usage
  # for streamed chat, even if the client omits it, without changing non-streams.
