name: local-llm

services:
  vllm:
    image: vllm/vllm-openai:latest
    restart: unless-stopped
    shm_size: "16gb"
    environment:
      VLLM_API_KEY: "${LLM_API_KEY:?Set LLM_API_KEY in .env}"
    command: >-
      unsloth/Qwen3.8-27B-NVFP4
      --speculative-config '{"method":"mtp","num_speculative_tokens":2}'
      --max-num-seqs 4
      --enable-auto-tool-choice
      --tool-call-parser qwen3_xml
      --reasoning-parser qwen3
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      start_period: 5m
    volumes:
      - ../../../.cache:/root/.cache
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  nginx:
    image: nginx:1.29
    restart: unless-stopped
    depends_on:
      - vllm
    env_file:
      - .env
    environment:
      LLM_UPSTREAM: vllm:8000
    command: ["/bin/sh", "/opt/nginx/start-nginx.sh"]
    volumes:
      - ./nginx.conf:/opt/nginx/nginx.conf.template:ro
      - ./scripts/start-nginx.sh:/opt/nginx/start-nginx.sh:ro

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    depends_on:
      - nginx
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN:?Set CLOUDFLARE_TUNNEL_TOKEN in .env}

# The model server stays private; only authenticated model discovery and chat
# completions are reachable through NGINX and Cloudflare Tunnel.
